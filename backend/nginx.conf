# =====================================================================
# 0Media Digital Signage — Configuración Nginx para Producción con SSL
# =====================================================================
# Ubicación habitual en Ubuntu/Debian: /etc/nginx/sites-available/0media
# Enlazar con: sudo ln -s /etc/nginx/sites-available/0media /etc/nginx/sites-enabled/

# Redirección forzada de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name signage.tuempresa.com; # <-- Cambia por tu dominio

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor seguro HTTPS con soporte WebSocket y Streaming
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signage.tuempresa.com; # <-- Cambia por tu dominio

    # Certificados SSL generados por Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/signage.tuempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signage.tuempresa.com/privkey.pem;

    # Cifrado seguro moderno (TLS 1.2 y 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamaño máximo de subida para videos 4K y archivos publicitarios
    client_max_body_size 500M;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Soporte para WebSockets en tiempo real (WSS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeceras de origen y protocolo
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts extendidos para conexiones WebSocket persistentes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Deshabilitar buffering para streaming continuo HTTP 206
        proxy_buffering off;
    }
}
